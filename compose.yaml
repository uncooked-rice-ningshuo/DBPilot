services:
  dbpilot:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DBPILOT_MASTER_KEY: ${DBPILOT_MASTER_KEY:-}
      DBPILOT_PUBLIC_HOSTS: ${DBPILOT_PUBLIC_HOSTS:-localhost,127.0.0.1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    volumes:
      - dbpilot-data:/data

volumes:
  dbpilot-data:
